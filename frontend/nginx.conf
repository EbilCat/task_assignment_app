# frontend/nginx.conf -> /etc/nginx/conf.d/default.conf in the image.
# Same job as vite.config.ts's dev proxy, for the containerised app:
# the browser only ever talks to this server, so /api stays same-origin
# (no CORS, no API URL baked into the JS bundle).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API: /api/tasks -> http://api:3000/tasks
  # "api" is the backend container's name on the compose network (Docker DNS).
  # The trailing "/" on proxy_pass is what strips the /api prefix.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;   # POST /tasks may wait up to GEMINI_TIMEOUT_MS (8 s)
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}